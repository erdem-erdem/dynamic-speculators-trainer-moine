<title>Inside the LoRA Generator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap">
<style>
/* Layout: one reading column (~760px) with wide figure rows; lab-notebook register:
   every section is a question, a verdict chip, the evidence, and what it means. */
:root {
  --bg: #f7f8f6; --surface: #ffffff; --ink: #14171a; --ink-2: #4a5157; --ink-3: #7a8288;
  --line: #e2e5e3; --accent: #2a5db0; --accent-soft: #e6edf8;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --neutral: #9aa3a8;
  --good: #1f7a3d; --warn: #a86a00; --bad: #b3261e;
  --good-bg: #e5f3ea; --warn-bg: #fbf0dc; --bad-bg: #fbe7e5;
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121416; --surface: #1a1d20; --ink: #eef0f1; --ink-2: #b9c0c5; --ink-3: #8a9399;
  --line: #2c3135; --accent: #7aa5ec; --accent-soft: #1f2a3b;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --neutral: #6c757b;
  --good: #6fcf8f; --warn: #e3b25a; --bad: #f08a80;
  --good-bg: #17291e; --warn-bg: #2d2412; --bad-bg: #321a18;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121416; --surface: #1a1d20; --ink: #eef0f1; --ink-2: #b9c0c5; --ink-3: #8a9399;
  --line: #2c3135; --accent: #7aa5ec; --accent-soft: #1f2a3b;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --neutral: #6c757b;
  --good: #6fcf8f; --warn: #e3b25a; --bad: #f08a80;
  --good-bg: #17291e; --warn-bg: #2d2412; --bad-bg: #321a18;
  color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.6 var(--f-body); }
.wrap { max-width: 1060px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.col { max-width: 760px; }
h1 { font: 650 clamp(30px, 5vw, 46px)/1.08 var(--f-display); letter-spacing: -0.01em; margin: 6px 0 12px; text-wrap: balance; }
h2 { font: 600 clamp(22px, 3vw, 28px)/1.2 var(--f-display); margin: 0 0 6px; text-wrap: balance; }
h3 { font: 600 16px/1.3 var(--f-body); margin: 18px 0 6px; }
p { margin: 0 0 12px; }
.eyebrow { font: 500 12px/1.4 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.lede { font-size: 18px; color: var(--ink-2); max-width: 760px; }
.muted { color: var(--ink-3); }
code, .mono { font-family: var(--f-mono); font-size: 0.9em; }
section { border-top: 1px solid var(--line); padding-block: 34px 10px; }
.verdicts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 22px 0 8px; }
.verdict { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.verdict .q { font: 500 13px/1.35 var(--f-body); color: var(--ink-2); }
.verdict .a { font: 600 15.5px/1.35 var(--f-body); }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--f-mono); padding: 5px 8px; border-radius: 999px; width: fit-content; }
.chip.no { background: var(--bad-bg); color: var(--bad); }
.chip.yes { background: var(--good-bg); color: var(--good); }
.chip.part { background: var(--warn-bg); color: var(--warn); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; margin: 14px 0 18px; }
.fig { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 10px; min-width: 0; }
.fig h4 { font: 600 14px/1.3 var(--f-body); margin: 0 0 2px; }
.fig .cap { font-size: 13px; color: var(--ink-3); margin: 0 0 6px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid line, .chart .gridline { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--ink-3); stroke-width: 1; }
.chart .zero { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .cross { stroke: var(--ink-3); stroke-width: 1; }
.chart text { fill: var(--ink-2); font: 11px var(--f-mono); }
.chart .axlabel { fill: var(--ink-3); font: 11px var(--f-body); }
.chart .rowlabel { fill: var(--ink); font: 12px var(--f-body); }
.chart .rowlabel.head { font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i, .tip i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 12px/1.5 var(--f-body); box-shadow: 0 6px 20px rgba(0,0,0,0.12); max-width: 300px; }
.tip .tt { font-weight: 600; margin-bottom: 2px; }
.tip div { display: flex; align-items: center; gap: 6px; }
.tip b { margin-left: auto; padding-left: 12px; font-family: var(--f-mono); font-weight: 500; }
.means { background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; margin: 6px 0 14px; max-width: 760px; }
.means b { color: var(--accent); }
.tablewrap { overflow-x: auto; margin: 10px 0 16px; }
table { border-collapse: collapse; font-size: 13.5px; min-width: 640px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
th { font: 500 12px/1.3 var(--f-body); color: var(--ink-3); text-align: right; }
td:first-child, th:first-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
.pipe { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; margin: 12px 0; }
.pipe .blk { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 96px; flex: 1 1 96px; }
.pipe .blk b { display: block; font: 600 13px/1.3 var(--f-body); }
.pipe .blk.heavy { border-color: var(--s2); }
.pipe .arrow { align-self: center; color: var(--ink-3); }
ul.tight { margin: 0 0 12px; padding-left: 20px; } ul.tight li { margin: 3px 0; }
.toc { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; margin: 10px 0 0; }
.toc a { color: var(--accent); text-decoration: none; } .toc a:hover { text-decoration: underline; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 520px) { body { font-size: 15px; } .figs { grid-template-columns: 1fr; } }
</style>
