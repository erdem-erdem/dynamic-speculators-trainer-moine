<title>Move vs Improve: Results</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one reading column (~70ch) with full-column figures; each study tier is a section,
   figures sit in hairline panels with a θ₁ switch where both starting points exist. */
:root {
  --bg: #f6f7f8; --surface: #fcfcfb; --fg: #101418; --fg-2: #4b5259; --muted: #858b91;
  --grid: #e3e5e7; --axis: #c3c7cb; --line: rgba(16,20,24,.10);
  --accent: #2a78d6; --good: #0f7f4f; --bad: #c43d3c;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --chip: #e9eef4;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1113; --surface: #171a1d; --fg: #eef0f2; --fg-2: #b9bfc5; --muted: #858b91;
  --grid: #262a2e; --axis: #3a3f44; --line: rgba(255,255,255,.10);
  --accent: #3987e5; --good: #2fbf7a; --bad: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #2f9a2f; --s7: #9085e9; --s8: #e66767;
  --chip: #1f2833; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1113; --surface: #171a1d; --fg: #eef0f2; --fg-2: #b9bfc5; --muted: #858b91;
  --grid: #262a2e; --axis: #3a3f44; --line: rgba(255,255,255,.10);
  --accent: #3987e5; --good: #2fbf7a; --bad: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #2f9a2f; --s7: #9085e9; --s8: #e66767;
  --chip: #1f2833; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--f-body); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 24px; font-weight: 600; margin-top: 8px; }
h3 { font-size: 17px; font-weight: 600; }
p, li { max-width: 70ch; }
p { margin: 0; }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lede { font-size: 18px; color: var(--fg-2); max-width: 64ch; }
section { display: grid; gap: 14px; padding-block: 34px 6px; border-top: 1px solid var(--line); }
header { display: grid; gap: 14px; padding-bottom: 26px; }
.answer { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
.answer h2 { margin: 0; font-size: 21px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.kpi b { font: 600 24px/1.1 var(--f-display); }
.kpi span { font-size: 13px; color: var(--fg-2); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 10px; display: grid; gap: 10px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.panel-head h3 { font-size: 15px; }
.fig-id { font: 500 12px var(--f-mono); color: var(--accent); margin-right: 6px; }
.note { font-size: 13px; color: var(--fg-2); }
.chart { min-width: 0; overflow-x: auto; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
svg.viz { width: 100%; height: auto; display: block; font-family: var(--f-mono); }
svg.viz .tick { font-size: 10.5px; }
svg.viz .axlabel { font-size: 11.5px; font-family: var(--f-body); }
svg.viz .plabel { font-size: 10px; }
svg.viz .cell { font-size: 10.5px; }
svg.heat { min-width: 420px; }
.viz-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--fg-2); }
.viz-legend i, .viz-tip i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.viz-tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line);
  box-shadow: 0 4px 16px rgba(0,0,0,.12); border-radius: 6px; padding: 8px 10px; font: 12.5px/1.45 var(--f-body); max-width: 320px; }
.tip-h { font-weight: 600; margin-bottom: 2px; }
.tip-mute { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: 500 12.5px var(--f-body); background: transparent; color: var(--fg-2); border: 0; padding: 5px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--chip); color: var(--fg); }
.seg button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
select { font: 13px var(--f-body); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { font: 500 12px var(--f-body); color: var(--fg-2); background: var(--chip); position: sticky; top: 0; }
tbody tr:last-child td { border-bottom: 0; }
.verdict { display: inline-block; font: 600 11.5px var(--f-mono); letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; }
.v-yes { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.v-no { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.v-unc { background: var(--chip); color: var(--fg-2); }
.pos { color: var(--good); } .neg { color: var(--bad); }
code { font: 13px var(--f-mono); background: var(--chip); padding: 1px 5px; border-radius: 4px; }
ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.toc a { color: var(--fg-2); text-decoration: none; border-bottom: 1px solid var(--line); }
.toc a:hover { color: var(--accent); }
footer { font-size: 12.5px; color: var(--muted); padding-top: 26px; border-top: 1px solid var(--line); margin-top: 30px; display: grid; gap: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
