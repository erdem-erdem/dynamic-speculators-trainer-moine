# 24K mixed comparison, KL loss (user 2026-11-10): static LoRA vs the generator, both
# trained on 6,000 rows from each of math / code / stem / chat (24,000 rows)
# for 3 epochs. Same settings as the 10K-math run (math10k/static_lora.yaml) except
# the training rows and the store; differs from m0/static_lora.yaml (M0) in:
# - data: release r0002-100k, train splits of subsets 00000..00005 in each
#   category (6 x 1,000 rows per category);
# - evaluation rows: the 10K-math stored sets (math10k/eval_splits.json;
#   validation 200 math + 100 code / stem / chat, test the same mix from
#   other subsets). Only rows whose prompt and sequence occur in NO train
#   split of any local release are eligible, so none is in these train rows
#   (subsets also disjoint: eval uses math-00010.., code-00012.., stem/chat-00010..).
#   No donor pool;
# - 3 epochs: 24,000 x 3 / 18 rows per update = 4,000 updates;
# - loss: KL (kl_div, D-PACE weights) for both arms (mix24k/training_recipe.yaml);
# - generator: decoder_width 256, condition_dim 32 (M0: 512, 64);
#   attention targets, rank 32, alpha 64 (LoRA coefficient 2), as M0;
# - own activation store (output/dflash-lora/activation-store-mix24k).
extends: ../common.yaml
name: mix24k-static-lora-attn-r32-3ep-kl
family: baseline
arm: static_lora
repo_id: erdem-erdem/dyn-spec-dflash-mix24k-static-lora-attn-r32-3ep-kl
training_recipe: mix24k/training_recipe.yaml  # paths resolve from common.yaml
trajectory_recipe: mix24k/trajectory_recipe.yaml
wandb:
  name_prefix: dflash-
evaluation_rows:
  rows_per_subset: 50
  seed: 20261110
  test_subset: null
  donor_subset: null
pool:
  train_subsets: [math-00000, math-00001, math-00002, math-00003, math-00004, math-00005, code-00000, code-00001, code-00002, code-00003, code-00004, code-00005, stem-00000, stem-00001, stem-00002, stem-00003, stem-00004, stem-00005, chat-00000, chat-00001, chat-00002, chat-00003, chat-00004, chat-00005]
  validation_subsets: [math-00010, math-00011, math-00012, math-00013, code-00012, code-00016, stem-00010, stem-00011, chat-00010, chat-00011]
  test_subsets: [math-00014, math-00015, math-00016, math-00017, code-00017, code-00018, stem-00012, stem-00013, chat-00012, chat-00013]
  rows: examples/dflash-lora/math10k/eval_splits.json
optimization:
  pretraining_updates: 4000
architecture:
  decoder_width: 256
  condition_dim: 32
online:
  activation_store:
    path: output/dflash-lora/activation-store-mix24k
    mode: read
provenance_dir: output/dflash-lora/activation-store-mix24k/provenance/vllm
