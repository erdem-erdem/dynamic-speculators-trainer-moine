# 10K-math loss variants (user 2026-11-10), GPU 1: generator with KL (kl_div)
# (train, offline eval, test, OOD v3). Base / CE generator / static: math10k tier.
tier: math10k
runs:
  - {recipe: examples/dflash-lora/math10k/generator_kl.yaml, mode: train}
