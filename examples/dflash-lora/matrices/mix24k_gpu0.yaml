# 24K mixed comparison, KL loss (user 2026-11-10), GPU 0: the generator (train,
# offline eval, test, OOD v3). The base drafter on these validation / test /
# OOD rows is the math10k tier's base run (same rows, same drafter).
tier: mix24k
runs:
  - {recipe: examples/dflash-lora/mix24k/generator.yaml, mode: train}
  - {recipe: examples/dflash-lora/mix24k/generator.yaml, mode: eval}
