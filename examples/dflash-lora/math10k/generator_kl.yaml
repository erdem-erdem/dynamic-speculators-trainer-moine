# 10K-math generator with loss kl_div (user 2026-11-10): math10k/generator.yaml differing only in the loss
# (training_recipe_kl.yaml) and name / repo. Original header follows.
# 10K-math comparison (user 2026-11-10): static LoRA vs a small generator,
# both trained on 10,000 math rows for 3 epochs and evaluated on enlarged,
# never-trained sets. Differs from m0/generator.yaml (M0) only in the settings below.
# - data: release r0002-100k (25 subsets of 1,000 train + 100 validation rows
#   per category); train splits of math-00000..00009 (10,000 rows);
# - evaluation rows (stored in eval_splits.json, make_eval_splits.py): 50 rows
#   from each of 10 validation splits for validation (every 250 updates;
#   200 math + 100 code / stem / chat) and 10 others for test (final numbers,
#   same mix). Only rows whose prompt and sequence occur in NO train split of
#   any local release are eligible (the data repeats prompts across rows).
#   No donor pool;
# - 3 epochs: 10,000 x 3 / 18 rows per update = 1,667 updates;
# - generator: decoder_width 256, condition_dim 32 (M0: 512, 64);
#   attention targets, rank 32, alpha 64 (LoRA coefficient 2), as M0;
# - own activation store (output/dflash-lora/activation-store-math10k).
extends: ../common.yaml
name: math10k-generator-attn-r32-3ep-kl
family: modules
arm: generator
repo_id: erdem-erdem/dyn-spec-dflash-math10k-generator-attn-r32-3ep-kl
training_recipe: math10k/training_recipe_kl.yaml  # paths resolve from common.yaml
trajectory_recipe: math10k/trajectory_recipe.yaml
wandb:
  name_prefix: dflash-
evaluation_rows:
  rows_per_subset: 50
  seed: 20261110
  test_subset: null
  donor_subset: null
pool:
  train_subsets: [math-00000, math-00001, math-00002, math-00003, math-00004, math-00005, math-00006, math-00007, math-00008, math-00009]
  validation_subsets: [math-00010, math-00011, math-00012, math-00013, code-00012, code-00016, stem-00010, stem-00011, chat-00010, chat-00011]
  test_subsets: [math-00014, math-00015, math-00016, math-00017, code-00017, code-00018, stem-00012, stem-00013, chat-00012, chat-00013]
  rows: examples/dflash-lora/math10k/eval_splits.json
optimization:
  pretraining_updates: 1667
architecture:
  decoder_width: 256
  condition_dim: 32
online:
  activation_store:
    path: output/dflash-lora/activation-store-math10k
    mode: read
provenance_dir: output/dflash-lora/activation-store-math10k/provenance/vllm
